<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2358e2c6%27/%3E%3Cpath d=%27M8 8h16v16H8z%27 fill=%27%2317212b%27/%3E%3C/svg%3E"><title>城构 · 游戏界面编辑器</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="editor-shell">
<header class="topbar">
  <div class="brand"><span class="brand-mark">▧</span><div>城构 <span class="brand-en">LAYOUT STUDIO</span></div></div>
  <div class="project-control"><span class="project-dot"></span><input id="project-name" aria-label="项目名称" value="未命名界面"><span class="local-tag">本地项目</span></div>
  <div class="toolbar-actions"><button id="load-demo">打开主城示例</button><button id="import-json">导入布局</button><button id="export-json">导出 JSON</button><button id="save-layout" class="button-muted">保存到浏览器</button><button id="apply-layout" class="button-primary">应用到主城 <span>↗</span></button></div>
</header>
<section class="screen-strip" aria-label="界面切换"><div class="screen-strip-tools"><span class="screen-strip-title">界面 <small>SCREENS</small></span><div><button id="add-screen" title="新增空白界面">＋ 新增</button><button id="duplicate-screen" title="复制当前界面">复制</button><button id="rename-screen" title="重命名当前界面">重命名</button><button id="delete-screen" class="danger-text" title="删除当前界面">删除</button></div></div><div id="screen-list" class="screen-list" aria-label="所有界面预览"></div></section>
<div class="workbench">
<aside class="left-panel panel">
  <div class="panel-tabs"><button id="tab-hierarchy" class="tab active" data-panel="hierarchy">图层 <span>LAYERS</span></button><button id="tab-assets" class="tab" data-panel="assets">素材 <span>ASSETS</span></button></div>
  <section id="hierarchy-panel" class="sidebar-section">
    <div class="layer-heading"><span>图层</span><span class="small-label">LAYERS</span></div>
    <div id="layer-list" class="layer-list" aria-label="图层列表"></div>
    <div class="layer-actions"><button id="add-layer" title="新增图层">＋</button><button id="rename-layer" title="重命名图层">重命名</button><button id="layer-up" title="图层上移" aria-label="图层上移">↑</button><button id="layer-down" title="图层下移" aria-label="图层下移">↓</button><button id="delete-layer" class="danger-text" title="删除图层">删除</button></div>
    <label class="layer-edit-option"><input id="layer-edit-mode" type="checkbox" title="开启后只允许在画布中编辑当前层，关闭后可点击任意层元素">隔离编辑当前层</label>
    <div class="element-heading"><span>元素 <strong id="active-layer-name">未选择图层</strong></span><span>层内排序</span></div>
    <div class="search-wrap"><span>⌕</span><input id="filter-nodes" placeholder="搜索当前层元素" aria-label="搜索当前层元素"></div>
    <div id="node-list" class="node-list"></div>
    <div class="panel-footer"><button id="duplicate-node" title="复制选中元素">＋ 复制元素</button><button id="delete-node" class="danger-text" title="删除选中元素">删除</button></div>
  </section>
  <section id="assets-panel" class="sidebar-section" hidden><div class="section-intro">素材库 <span>图像资源</span></div><p class="asset-hint">导入 PNG、JPG 等图像，再放入画布。</p><button id="add-image" class="upload-button">＋ 导入图片</button><div id="asset-list" class="asset-list"></div></section>
  <div class="sidebar-note"><span class="note-dot"></span>图片与布局在本机编辑</div>
</aside>
<main class="canvas-panel">
  <div class="canvas-toolbar"><div class="history-controls"><button id="undo" title="撤销" aria-label="撤销">↶</button><button id="redo" title="重做" aria-label="重做">↷</button><span class="toolbar-divider"></span><span class="canvas-title">界面画布</span></div><div class="canvas-settings"><label>尺寸 <input id="canvas-width" type="number" min="1" value="1672" aria-label="画布宽度"><span>×</span><input id="canvas-height" type="number" min="1" value="941" aria-label="画布高度"></label><span class="toolbar-divider"></span><label class="check-control"><input id="grid-toggle" type="checkbox">网格</label><label class="check-control"><input id="snap-toggle" type="checkbox" checked>吸附</label><label class="check-control"><input id="reference-toggle" type="checkbox">参考图</label></div></div>
  <div class="alignment-toolbar" aria-label="对齐与分布工具栏"><div class="alignment-target"><span id="selection-count">未选中</span><select id="align-target" aria-label="对齐参照"><option value="canvas">相对画布</option><option value="selection">相对所选范围</option></select></div><div class="alignment-buttons"><button id="align-left" title="将所选元素左边缘对齐到参照范围左侧">左对齐</button><button id="align-hcenter" title="将所选元素水平中心对齐">水平居中</button><button id="align-right" title="将所选元素右边缘对齐到参照范围右侧">右对齐</button><span class="toolbar-divider"></span><button id="align-top" title="将所选元素上边缘对齐到参照范围顶部">顶对齐</button><button id="align-vcenter" title="将所选元素垂直中心对齐">垂直居中</button><button id="align-bottom" title="将所选元素下边缘对齐到参照范围底部">底对齐</button><button id="align-center" title="将所选元素同时水平与垂直居中">整体居中</button><span class="toolbar-divider"></span><button id="distribute-h" title="在所选范围中水平等距分布元素">水平等距</button><button id="distribute-v" title="在所选范围中垂直等距分布元素">垂直等距</button></div><span class="multiselect-hint">Shift/Ctrl 点击多选</span></div>
  <div id="stage-wrap" class="stage-wrap"><div id="stage" class="stage" aria-label="可编辑游戏界面画布"></div></div>
  <div class="canvas-bottom"><span class="canvas-tip"><kbd>拖动</kbd> 移动元素 <span>·</span> 点击任意元素编辑；勾选隔离后仅编辑当前层</span><div class="zoom-controls"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="放大">＋</button><span class="toolbar-divider"></span><button id="fit-view">适应画布</button></div></div>
</main>
<aside class="right-panel panel"><div class="inspector-heading"><span>属性检查器</span><span class="small-label">INSPECTOR</span></div><div id="inspector-fields" class="inspector-fields"><div class="empty-state"><span class="empty-icon">⌖</span><strong>选择一个元素</strong><p>在画布或左侧列表中选择对象，<br>调整位置、尺寸和显示属性。</p></div></div><details class="reference-section" open><summary>设计参考 <span>REFERENCE</span></summary><div class="reference-content"><div id="reference-list" class="reference-list"></div><div class="reference-actions"><button id="add-reference">＋ 添加参考图</button><button id="remove-reference" class="danger-text">移除</button></div><label class="reference-opacity-label" for="reference-opacity">叠加透明度</label><input id="reference-opacity" type="range" min="0" max="100" value="45" aria-label="参考图叠加透明度"></div></details><div class="inspector-note"><span>工作流</span><p>编辑布局 → 导出 JSON<br>或应用到本地主城查看效果</p></div></aside>
</div>
<footer class="statusbar"><div><span class="status-dot"></span><span id="status" role="status" aria-live="polite">编辑器就绪</span></div><span>城构 <span class="status-separator">/</span> 2D 界面布局工具</span></footer>
</div>
<input id="file-json" type="file" accept=".json,application/json" hidden><input id="file-image" type="file" accept="image/*" multiple hidden>
<input id="reference-file" type="file" accept="image/*" hidden>
<script type="module" src="app.mjs"></script>
</body></html>
